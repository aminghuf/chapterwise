[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chapterwise"
version = "0.1.0"
description = "Summarize your books chapter by chapter with an LLM and read them in micro-doses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Seyedamin Ghazizadeh" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "openai>=1.40",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "reportlab>=4",   # builds PDF fixtures in tests
  "ruff>=0.6",
]

[project.scripts]
chapterwise = "chapterwise.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chapterwise"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
