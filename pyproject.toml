[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chapterwise"
version = "0.3.0"
description = "Summarize your books chapter by chapter with an LLM and read them in micro-doses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Seyedamin Ghazizadeh" }]
dependencies = [
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "fastapi>=0.115",
  "itsdangerous>=2.1",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "python-telegram-bot[job-queue]>=21.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "tzdata>=2024.1",   # time zones in slim containers
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",    # FastAPI test client
  "pytest>=8",
  "reportlab>=4",   # builds PDF fixtures in tests
  "ruff>=0.6",
]

[project.scripts]
chapterwise = "chapterwise.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chapterwise"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
