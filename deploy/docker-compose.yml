# chapterwise on the VPS. Run through ./cw.sh so .env and the pinned image (image.env) are applied.

name: chapterwise

x-app: &app
  image: ${IMAGE:?set by image.env}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://chapterwise:${POSTGRES_PASSWORD:?}@db:5432/chapterwise
    CHAPTERWISE_BOOKS_DIR: /books
  volumes:
    # BookOrbit's library, read-only: chapterwise never changes your books.
    - ${BOOKS_HOST_PATH:-/root/bookorbit/books}:/books:ro
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chapterwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: chapterwise
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapterwise -d chapterwise"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    command: ["chapterwise", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: ["chapterwise", "serve", "--host", "0.0.0.0", "--port", "8100"]
    # Loopback only: Caddy on the host is the way in.
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["chapterwise", "worker"]
    healthcheck:
      disable: true
    stop_grace_period: 60s  # let a running summary finish
    depends_on:
      migrate:
        condition: service_completed_successfully
