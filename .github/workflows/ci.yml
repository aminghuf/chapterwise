name: CI/CD

# Every push and PR: lint + tests (with a real Postgres).
# Pushes to main: build the image, push it to GHCR, deploy it to the VPS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chapterwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chapterwise_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -rs

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-chapterwise
      cancel-in-progress: false
    env:
      REMOTE: root@${{ secrets.DEPLOY_HOST }}
      REMOTE_DIR: /root/chapterwise
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KNOWN" ]; then
            echo "::error::Set the DEPLOY_HOST, DEPLOY_KNOWN_HOSTS and DEPLOY_SSH_KEY secrets (see README)."
            exit 1
          fi

      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinned host key instead of ssh-keyscan, which would trust whoever answers on that address.
      - name: Trust the server's host key
        env:
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: mkdir -p ~/.ssh && echo "$KNOWN" >> ~/.ssh/known_hosts

      - name: Check the server is bootstrapped
        run: |
          if ! ssh "$REMOTE" "test -f $REMOTE_DIR/.env"; then
            echo "::error::$REMOTE_DIR/.env missing: run deploy/server-bootstrap.sh on the VPS first."
            exit 1
          fi

      - name: Upload config
        run: rsync -az --chmod=F644 deploy/docker-compose.yml "$REMOTE:$REMOTE_DIR/" &&
          rsync -az --chmod=F755 deploy/cw.sh "$REMOTE:$REMOTE_DIR/"

      - name: Back up the database
        run: ssh "$REMOTE" "cd $REMOTE_DIR && touch image.env && ./cw.sh backup pre-$TAG"

      - name: Pull and start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes through stdin, never onto a command line, and is logged out right after the pull.
          echo "$GH_TOKEN" | ssh "$REMOTE" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$REMOTE" "cd $REMOTE_DIR \
            && echo IMAGE=$IMAGE:$TAG > image.env \
            && (./cw.sh pull; status=\$?; docker logout ghcr.io; exit \$status) \
            && ./cw.sh up -d --remove-orphans"

      - name: Verify health
        run: |
          for _ in $(seq 1 30); do
            if ssh "$REMOTE" 'curl -sf http://127.0.0.1:8100/healthz >/dev/null'; then
              echo "Healthy on $TAG"
              ssh "$REMOTE" "echo $TAG > $REMOTE_DIR/.deployed && docker image prune -f >/dev/null"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed. Recent logs:"
          ssh "$REMOTE" "cd $REMOTE_DIR && ./cw.sh ps && ./cw.sh logs --tail 80 migrate web worker" || true
          exit 1
